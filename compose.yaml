services:
  nginx:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    ports: ["8080:80"]
    depends_on: [php]
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: preview
    environment:
      DB_HOST: mysql
      DB_DATABASE: ${MYSQL_DATABASE:-bento}
      DB_USER: ${MYSQL_USER:-bento}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bento}
      MYSQL_USER: ${MYSQL_USER:-bento}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  mysql-data:
