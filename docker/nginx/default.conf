server {
    listen 80;
    server_name _;
    server_tokens off;
    root /var/www/html/public;
    index index.php;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location ~ /\. { return 404; }
    location ~ ^/(?:vendor|src|config|var|tools|database|bin)(?:/|$) { return 404; }
    location ~* ^/uploads/.*\.php(?:/|$) { return 404; }
    location / { rewrite ^ /index.php last; }
    location /assets/ { try_files $uri =404; }
    location /uploads/ { try_files $uri =404; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_pass app:9000;
    }
    location ~ \.php$ { return 404; }
}
